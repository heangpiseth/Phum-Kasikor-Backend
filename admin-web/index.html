<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f4">
  <title>Phum Kasikor | Admin</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/details.css">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Phum Kasikor admin home">
        <span class="brand-mark">PK</span>
        <span><strong>Phum Kasikor</strong><small>Operations console</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="navigation" id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <span class="connection-dot"></span>
        <span>Connected to Laravel API</span>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <div class="topbar-context"><span class="eyebrow">PHUM KASIKOR PLATFORM</span><strong id="topbar-title">Dashboard</strong></div>
        <div class="topbar-actions">
          <span class="api-indicator"><span class="connection-dot"></span> API connected</span>
          <div class="user-chip"><span class="avatar" id="user-avatar">A</span><span class="user-name" id="user-name">Administrator</span></div>
          <button class="button button-quiet" id="logout-button">Sign out</button>
        </div>
      </header>
      <main id="content" class="content" tabindex="-1" aria-live="polite"></main>
      <footer class="footer"><span>Phum Kasikor Admin</span><span>Laravel REST API · <span id="api-host"></span></span></footer>
    </div>
  </div>
  <div class="mobile-scrim" id="mobile-scrim"></div>
  <div id="toast-region" class="toast-region" aria-live="assertive"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
